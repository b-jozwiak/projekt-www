<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyszukaj Gry</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <h1>Wyszukaj Gry</h1>
        <nav>
            <a href="index.html">Lista</a>
            <a href="search.html">Wyszukaj</a>
            <a href="favorites.html">Ulubione</a>
            <a href="stats.html">Statystyki</a>
        </nav>
    </header>
    <main>
        <section id="search-form">
            <form>
                <div class="filter-row">
                    <label for="search-query">Wyszukaj po nazwie:</label>
                    <input type="text" id="search-query" name="query" placeholder="Wpisz nazwę..." minlength="2" aria-label="Szukaj gry">
                </div>
                <div class="filter-row">
                    <label for="filter-genre">Filtruj po gatunku:</label>
                    <select id="filter-genre" name="genre">
                        <option value="">Wszystkie</option>
                        <option value="RPG">RPG</option>
                        <option value="Akcja">Akcja</option>
                        <option value="Przygoda">Przygoda</option>
                        <option value="Sandbox">Sandbox</option>
                        <option value="Logiczna">Logiczna</option>
                        <option value="Symulacja">Symulacja</option>
                    </select>
                </div>
                <div class="filter-row">
                    <label for="filter-platform">Filtruj po platformie:</label>
                    <select id="filter-platform" name="platform">
                        <option value="">Wszystkie</option>
                        <option value="PC">PC</option>
                        <option value="PlayStation">PlayStation</option>
                        <option value="Xbox">Xbox</option>
                        <option value="Nintendo Switch">Nintendo Switch</option>
                        <option value="Mobile">Mobile</option>
                    </select>
                </div>
                <button type="submit">Szukaj</button>
            </form>
        </section>
        <section id="search-results">
            <p class="empty-message">Wprowadź kryteria wyszukiwania.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Aplikacja Gier</p>
    </footer>
    <script src="js/search.js" type="module"></script>
</body>
</html>
